name: Userscript syntax

on:
  pull_request:
    paths:
      - "a-share.user.js"
      - "fx-kurumi.user.js"
      - "fx-quant.user.js"
      - ".github/workflows/userscript-syntax.yml"
      - "tests/**"
      - "tools/**"
      - "docs/performance-benchmark.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Check userscript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse all userscripts
        run: |
          set -eu
          node --check a-share.user.js
          node --check fx-kurumi.user.js
          node --check fx-quant.user.js
          node --check tools/toy-performance-monitor.user.js
          node --check tools/kurumi-public-api-probe.user.js
      - name: Run performance primitive regression tests
        run: node --test tests/*.test.mjs
